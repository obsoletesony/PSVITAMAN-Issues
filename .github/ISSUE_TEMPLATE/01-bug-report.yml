name: Report a PSVITAMAN issue / 問題を報告
description: Tell us what happened. English or Japanese. / 英語・日本語で報告できます。
title: '[Bug] '
labels:
- 'type: bug'
- 'status: needs triage'
body:
- type: markdown
  attributes:
    value: 'Tell us what happened. English and Japanese are welcome. Fill in what you know; “I don’t know” is fine.


      問題の内容を英語または日本語で教えてください。分からない項目は「分かりません」で大丈夫です。


      Reports and attachments are public. Do not upload music, passwords, Jellyfin access tokens, Quick Connect secrets, or private information. / 報告と添付ファイルは公開されます。音楽、パスワード、Jellyfin のアクセストークン、Quick Connect の秘密情報、個人情報は添付しないでください。


      Real PS Vita / PS TV hardware only. / PS Vita・PS TV 実機での報告専用です。'
- type: dropdown
  id: area
  attributes:
    label: Where did the problem occur?
    description: Choose the closest match. / 問題が発生した場所を選んでください。
    options:
    - Local playback or library
    - Jellyfin connection / Quick Connect
    - Jellyfin library browsing
    - Jellyfin playback
    - Jellyfin artwork
    - Settings / controls / interface
    - Startup / shutdown / suspend
    - Other
  validations:
    required: true
- type: dropdown
  id: vita-model
  attributes:
    label: PS Vita model
    description: The model family is enough. 本体の機種。分からない場合は Not sure を選んでください。
    options:
    - PS Vita PCH-1000 (OLED)
    - PS Vita PCH-2000 (Slim)
    - PS TV / Vita TV
    - Not sure
  validations:
    required: true
- type: input
  id: firmware
  attributes:
    label: System software or custom firmware
    description: Include both if you know them. システムソフトウェア / CFW。分かる範囲で入力してください。
    placeholder: System version and homebrew setup, or I don't know
  validations:
    required: false
- type: input
  id: psvitaman-version
  attributes:
    label: PSVITAMAN version
    description: The release or build you installed. If unknown, write I don't know. アプリのバージョン。分かる範囲で入力してください。
    placeholder: Public Alpha version or build
  validations:
    required: false
- type: textarea
  id: what-happened
  attributes:
    label: What happened?
    description: What did you see or hear? 何が起きましたか？ 期待した動作と実際の動作を教えてください。
    placeholder: PSVITAMAN opened normally. I selected a song, the cover appeared, and then...
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: What did you do right before it happened? If it only happened once, list what you remember. 再現手順。繰り返し起きるかどうかも教えてください。
    placeholder: '1. Opened PSVITAMAN

      2. Opened ...

      3. Selected ...

      4. Pressed ...

      '
  validations:
    required: false
- type: markdown
  attributes:
    value: '### If this is a Jellyfin / Network problem


      Please check the same server and affected track in another Jellyfin client when possible.


      In the field below, tell us whether the problem is connection / Quick Connect, browsing, playback start, interruptions, seeking, artwork, or track advance. Also include whether it affects one track or all tracks you tried, FLAC or MP3, the sample rate / bit depth shown by PSVITAMAN, whether `JELLYFIN` appears in Now Playing, and your Jellyfin server version if known.


      Describe the local network only in general terms. Never paste passwords, access tokens, Quick Connect secrets, or credential-bearing URLs.


      Jellyfin に関する問題の場合、可能であれば別の Jellyfin クライアントでも同じサーバー／曲を確認してください。パスワード、アクセストークン、Quick Connect の秘密情報は投稿しないでください。

      '
- type: textarea
  id: jellyfin-details
  attributes:
    label: Jellyfin / Network details
    description: Leave blank if this is not a Jellyfin report. / Jellyfin に関係しない場合は空欄で構いません。
    placeholder: 'Example: Playback interruption. Same track works on another client. FLAC 192 kHz / 24 bit. JELLYFIN is visible. Happens on every remote track. Jellyfin server version: ...'
  validations:
    required: false
- type: markdown
  attributes:
    value: '### Diagnostic log


      Copy `ux0:/data/PSVITAMAN/PSVITAMAN-HW-DIAG.log` before launching PSVITAMAN again. A clean START shutdown
      also exports `ux0:/PSVITAMAN-HW-DIAG.log`; after a crash, that root copy may be stale. The previous session
      is rotated to `ux0:/data/PSVITAMAN/PSVITAMAN-HW-DIAG.previous.log` on the next launch.


      Check the log before uploading it. Issues are public; logs can contain song names, file names, paths, and server/network details.

      '
- type: upload
  id: diagnostic-log
  attributes:
    label: Attach PSVITAMAN-HW-DIAG.log
    description: If you have it, attach the .log here. Do not upload music or the whole Vita storage. 診断ログがあれば添付してください。なくても報告できます。
  validations:
    required: false
    accept: .log,.txt
- type: upload
  id: media
  attributes:
    label: Photo, screenshot, or short video
    description: Optional. A phone photo of the PS Vita screen is fine. 写真や短い動画があれば添付してください。
  validations:
    required: false
    accept: .png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm
- type: checkboxes
  id: public-confirmation
  attributes:
    label: Before submitting / 送信前の確認
    options:
    - label: I checked attachments for private information and did not upload music, passwords, Jellyfin tokens, or Quick Connect secrets. / 添付ファイルに個人情報、音楽ファイル、パスワード、Jellyfin トークン、Quick Connect の秘密情報が含まれていないことを確認しました。
      required: true
