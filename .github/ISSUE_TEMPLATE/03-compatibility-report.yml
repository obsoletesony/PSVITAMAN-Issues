name: Share a compatibility result
description: Tested PSVITAMAN on a PS Vita or firmware combo? Add the result here.
title: '[Compatibility] '
labels:
- 'type: compatibility'
- 'status: needs triage'
body:
- type: markdown
  attributes:
    value: 'Tested PSVITAMAN on a PS Vita or firmware combo? Add the result here.


      Successful tests matter too. You do not need to test everything.

      '
- type: dropdown
  id: vita-model
  attributes:
    label: PS Vita model
    options:
    - PS Vita PCH-1000 (OLED)
    - PS Vita PCH-2000 (Slim)
    - PS TV / Vita TV
    - Vita3K
    - Not sure
  validations:
    required: true
- type: input
  id: exact-model
  attributes:
    label: Exact model number
    description: Optional. For example PCH-2001 or PCH-1004.
    placeholder: PCH-2001
  validations:
    required: false
- type: input
  id: firmware
  attributes:
    label: System software or custom firmware
    placeholder: System version and homebrew setup, or I don't know
  validations:
    required: true
- type: input
  id: psvitaman-version
  attributes:
    label: PSVITAMAN version
    description: The release or build you installed. If unknown, write I don't know.
    placeholder: Public Alpha version or build
  validations:
    required: true
- type: dropdown
  id: overall-result
  attributes:
    label: Overall result
    options:
    - Works normally
    - Works with a minor problem
    - Works with a serious problem
    - Opens but cannot play music
    - Does not open
    - Appears as corrupted data
    - Not sure
  validations:
    required: true
- type: dropdown
  id: tested-areas
  attributes:
    label: What did you test?
    description: Select everything you tried.
    multiple: true
    options:
    - Installation and LiveArea launch
    - Cold startup and library scan
    - Warm startup using the cache
    - Library browsing
    - FLAC playback
    - MP3 playback
    - Pause and resume
    - Seek
    - Previous and next
    - Natural track advance
    - Album artwork
    - Queue
    - Playlists and favorites
    - Cassette view
    - START shutdown
  validations:
    required: true
- type: textarea
  id: notes
  attributes:
    label: Result details
    description: What worked? Anything odd?
    placeholder: PSVITAMAN launched, found 215 tracks, played several FLAC files, and returned to the LiveArea normally.
  validations:
    required: true
- type: input
  id: library-size
  attributes:
    label: Approximate library size
    description: Optional. Track count and rough storage used.
    placeholder: 215 tracks, about 12 GB
  validations:
    required: false
- type: dropdown
  id: log-status
  attributes:
    label: Diagnostic log
    options:
    - Attached below
    - Available but not attached
    - Could not find it
    - Not needed because everything worked
    - Not sure
  validations:
    required: true
- type: upload
  id: diagnostic-log
  attributes:
    label: Attach PSVITAMAN-HW-DIAG.log
    description: Optional. The issue is public, and the log may contain song names, file names, or paths. Review
      it before uploading, or submit without it.
  validations:
    required: false
    accept: .log,.txt
- type: upload
  id: media
  attributes:
    label: Photo or video
    description: Optional. A photo of PSVITAMAN running on the PS Vita is enough.
  validations:
    required: false
    accept: .png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm
- type: checkboxes
  id: public-confirmation
  attributes:
    label: Before submitting
    options:
    - label: I understand that this issue and its attachments are public.
      required: true
    - label: I checked anything I attached for information I do not want public.
      required: true
    - label: I did not upload copyrighted music.
      required: true
