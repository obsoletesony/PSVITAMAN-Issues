name: Ask for help
description: Stuck, or not sure whether something is a bug? Start here.
title: '[Help] '
labels:
- 'type: help'
- 'status: needs triage'
body:
- type: markdown
  attributes:
    value: 'Not sure whether it is a bug? Use this form.


      Tell us what you are trying to do and where it goes wrong. If you do not know your firmware or PSVITAMAN version,
      leave it blank.

      '
- type: textarea
  id: goal
  attributes:
    label: What are you trying to do?
    placeholder: I am trying to install PSVITAMAN / play my music / find the diagnostic log...
  validations:
    required: true
- type: textarea
  id: stuck
  attributes:
    label: Where are you stuck?
    description: Include any message shown on the PS Vita.
    placeholder: Tell us what you see and what happens when you try.
  validations:
    required: true
- type: dropdown
  id: vita-model
  attributes:
    label: PS Vita model
    options:
    - PS Vita PCH-1000 (OLED)
    - PS Vita PCH-2000 (Slim)
    - PS TV / Vita TV
    - Vita3K
    - Not sure
  validations:
    required: true
- type: input
  id: firmware
  attributes:
    label: System software or custom firmware
    placeholder: System version and homebrew setup, or I don't know
  validations:
    required: false
- type: input
  id: psvitaman-version
  attributes:
    label: PSVITAMAN version
    placeholder: Public Alpha version or build
    description: The release or build you installed. If unknown, write I don't know.
  validations:
    required: false
- type: upload
  id: media
  attributes:
    label: Photo or screenshot
    description: Optional. A phone photo of the PS Vita screen is fine.
  validations:
    required: false
    accept: .png,.jpg,.jpeg,.gif,.webp
- type: textarea
  id: tried
  attributes:
    label: What have you already tried?
    description: Optional.
    placeholder: I reinstalled the VPK, restarted the Vita, tried another music file...
  validations:
    required: false
- type: checkboxes
  id: public-confirmation
  attributes:
    label: Before submitting
    options:
    - label: I understand that this issue and its attachments are public.
      required: true
    - label: I did not upload copyrighted music or private information.
      required: true
