name: Suggest an improvement
description: Feature idea, workflow change, or usability improvement.
title: '[Idea] '
labels:
- 'type: feature'
- 'status: needs triage'
body:
- type: markdown
  attributes:
    value: 'Tell us what you would change and why. The use case matters more than an implementation.


      This repo is public. Do not include private source code or other non-public material.

      '
- type: textarea
  id: use-case
  attributes:
    label: What problem would this solve?
    description: What are you trying to do that PSVITAMAN does not handle well today?
    placeholder: When I use PSVITAMAN as a desk player, I need to...
  validations:
    required: true
- type: textarea
  id: suggestion
  attributes:
    label: Suggested improvement
    description: What would you change?
    placeholder: Add an option that...
  validations:
    required: true
- type: textarea
  id: benefit
  attributes:
    label: Why would this be useful?
    description: Who would use it, and when?
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives or workarounds
    description: Optional. How do you handle this now?
  validations:
    required: false
- type: dropdown
  id: vita-model
  attributes:
    label: PS Vita model
    description: The model family is enough.
    options:
    - PS Vita PCH-1000 (OLED)
    - PS Vita PCH-2000 (Slim)
    - PS TV / Vita TV
    - Vita3K
    - Not sure
  validations:
    required: false
- type: upload
  id: mockup
  attributes:
    label: Sketch or mockup
    description: Optional. Attach one if it helps explain the idea.
  validations:
    required: false
    accept: .png,.jpg,.jpeg,.gif,.webp,.svg
- type: checkboxes
  id: public-confirmation
  attributes:
    label: Before submitting
    options:
    - label: I understand that this issue and its attachments are public.
      required: true
    - label: I did not include copyrighted music, private source code, or confidential information.
      required: true
